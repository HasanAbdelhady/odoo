[options]
; Database settings
db_host = db
db_port = 5432
db_user = odoo
db_password = odoo
db_name = odoo_main

; Proxy settings for Cloudflare
proxy_mode = True

; Security settings
list_db = False
admin_passwd = $pbkdf2-sha512$600000$YOUR_ADMIN_PASSWORD_HASH

; Performance settings
workers = 2
max_cron_threads = 1
limit_memory_hard = 2684354560
limit_memory_soft = 2147483648
limit_request = 8192
limit_time_cpu = 600
limit_time_real = 1200

; Paths
addons_path = /usr/lib/python3/dist-packages/odoo/addons,/var/lib/odoo/addons/18.0,/mnt/extra-addons

; Logging
log_level = info
log_handler = :INFO
