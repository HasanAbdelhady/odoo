services:
  db:
    image: postgres:17
    environment:
      POSTGRES_DB: postgres
      POSTGRES_USER: odoo
      POSTGRES_PASSWORD: odoo
    volumes:
      - odoo-db-data:/var/lib/postgresql/data
    restart: unless-stopped

  odoo:
    build: .
    depends_on:
      - db
    ports:
      - "8069:8069"
    
    volumes:
      - odoo-web-data:/var/lib/odoo
      - ./custom_addons:/mnt/extra-addons/custom_addons
      - ./odoo-docker.conf:/etc/odoo/odoo.conf
    
    restart: unless-stopped
    command: ["odoo", "-c", "/etc/odoo/odoo.conf"]
  # Nginx reverse proxy for public access
  # nginx:
  #   image: nginx:alpine
  #   ports:
  #     - "80:80"
  #     - "443:443"
  #   volumes:
  #     - ./nginx.conf:/etc/nginx/nginx.conf
  #     - ./ssl:/etc/nginx/ssl
  #   depends_on:
  #     - odoo
  #   restart: unless-stopped

volumes:
  odoo-web-data:
  odoo-db-data:
